name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Compile and verify generator
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon build --stacktrace 2>&1 | tee build-verification.log
      - name: Verify distribution and export actual reference blocks
        shell: bash
        run: |
          python3 scripts/verify-artifact.py fabric/build/libs/castleforge-fabric-0.3.0-alpha.2.jar
          java -Xmx512m -cp core/build/classes/java/main:core/build/classes/java/test dev.castleforge.core.ReferenceExport build/reference
      - uses: actions/upload-artifact@v4
        with:
          name: castleforge-fabric-26.1.2
          path: fabric/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            build-verification.log
            core/build/reports/
            fabric/build/reports/
            build/reference/
            build/JAR_SHA256.txt
          if-no-files-found: warn

